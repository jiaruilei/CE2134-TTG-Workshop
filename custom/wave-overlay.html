<canvas id="water" aria-hidden="true" hidden></canvas>
<div id="water-caption" class="tank-water-caption" aria-hidden="true"><span>PHYSICAL</span><i>+</i><span>DIGITAL</span></div>
<div id="wave-controls" class="tank-wave-controls" hidden>
  <button id="pause" type="button">Pause water</button>
  <button id="skip" type="button">Back to slide</button>
</div>
<div id="fill-indicator" class="tank-fill-indicator" hidden><span id="fill-label">Water entering</span><strong id="fill-value">0%</strong></div>
<p id="camera-status" class="tank-sr-only" role="status" aria-live="polite"></p>
<p id="wave-status" class="tank-sr-only" role="status" aria-live="polite"></p>
